<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C7FB0"/>
      <stop offset="1" stop-color="#0B3E5C"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square, an original teal-blue palette — deliberately
       distinct from Scaleway's actual purple/violet brand mark, since this is
       an unofficial, third-party community integration, not their asset. -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- Cloud silhouette, built from overlapping same-fill shapes rather than
       a single traced path — an original abstract mark, not Scaleway's own
       logo geometry. -->
  <rect x="56" y="132" width="144" height="52" rx="26" fill="#F4FAFC"/>
  <circle cx="98" cy="122" r="30" fill="#F4FAFC"/>
  <circle cx="140" cy="106" r="38" fill="#F4FAFC"/>
  <circle cx="180" cy="126" r="26" fill="#F4FAFC"/>

  <!-- Status/monitoring badge at the cloud's edge: stands in for "read-only
       resource status" without borrowing any Scaleway iconography. -->
  <circle cx="178" cy="176" r="23" fill="#0B3E5C"/>
  <circle cx="178" cy="176" r="23" fill="none" stroke="#F5A623" stroke-width="4" opacity="0.55"/>
  <circle cx="178" cy="176" r="11" fill="#F5A623"/>
</svg>
